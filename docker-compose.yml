# DEAD AIR -- local plant and observability tooling.
#
# Services:
#   mcp-grafana  Grafana MCP server, self-hosted (the agent's tool surface)
#   emitter      synthetic metrics source, Step 1 of the plant
#   alloy        Grafana Alloy collector -> Grafana Cloud Mimir
#   webhook      local alert receiver (stand-in for the agent trigger)
#
# Everything runs locally. Nothing here needs GCE or Cloud Run.
#
# Setup from a clean clone:
#   cp agents/grafana_probe/.env.example agents/grafana_probe/.env
#   # fill in the token values, then:
#   make plant-up

services:
  mcp-grafana:
    # Verified working 2026-08-17 at
    # sha256:f21a19cebbfa7c3a76ef1746171e5ffc3601064e432f593e7c6cb526e5216e5f
    # (upstream publishes no semver tags). Pin that digest if latest breaks.
    image: grafana/mcp-grafana:latest
    container_name: deadair-mcp-grafana
    # -address: listen on 8010 inside the container so it matches the host
    #   port 1:1. The server validates the Host header against its listen port
    #   (DNS-rebinding protection), so a remapped port (e.g. 8010->8000) makes
    #   every request 403.
    # -allowed-hosts: explicit, covering both spellings of loopback.
    command:
      [
        "-t", "streamable-http",
        "-address", "0.0.0.0:8010",
        "-allowed-hosts", "localhost:8010,127.0.0.1:8010",
      ]
    # Reads GRAFANA_URL and GRAFANA_SERVICE_ACCOUNT_TOKEN. The file is
    # gitignored; compose fails loudly here if you haven't created it.
    env_file:
      - agents/grafana_probe/.env
    ports:
      # 8010 because `adk web` owns host port 8000. Bound to localhost so the
      # token-holding server is never reachable from the LAN.
      - "127.0.0.1:8010:8010"
    restart: unless-stopped

  # --- Step 1a: synthetic metrics source -------------------------------------
  emitter:
    build: ./plant/emitter
    container_name: deadair-emitter
    ports:
      # Exposed so `make set VALUE=n` can drive it from the host.
      - "127.0.0.1:9101:9101"
    restart: unless-stopped

  # --- Step 1b: collector -> Grafana Cloud Mimir ------------------------------
  alloy:
    image: grafana/alloy:latest
    container_name: deadair-alloy
    command:
      [
        "run",
        "--server.http.listen-addr=0.0.0.0:12345",
        "--storage.path=/var/lib/alloy/data",
        "/etc/alloy/config.alloy",
      ]
    volumes:
      - ./plant/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
    env_file:
      - agents/grafana_probe/.env
    ports:
      # Alloy's own UI -- component graph and remote_write health.
      - "127.0.0.1:12345:12345"
    depends_on:
      - emitter
    restart: unless-stopped

  # --- Step 1d: local alert webhook receiver ---------------------------------
  webhook:
    build: ./plant/webhook
    container_name: deadair-webhook
    ports:
      - "127.0.0.1:9102:9102"
    restart: unless-stopped

volumes:
  alloy-data:
