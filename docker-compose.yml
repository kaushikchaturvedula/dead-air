# DEAD AIR -- local plant and observability tooling.
#
# Services:
#   mcp-grafana  Grafana MCP server, self-hosted (the agent's tool surface)
#   emitter      synthetic metrics source, Step 1 of the plant
#   alloy        Grafana Alloy collector -> Grafana Cloud Mimir
#   webhook      local alert receiver (stand-in for the agent trigger)
#
# Everything runs locally. Nothing here needs GCE or Cloud Run.
#
# Setup from a clean clone:
#   cp agents/grafana_probe/.env.example agents/grafana_probe/.env
#   # fill in the token values, then:
#   make plant-up

services:
  mcp-grafana:
    # Verified working 2026-08-17 at
    # sha256:f21a19cebbfa7c3a76ef1746171e5ffc3601064e432f593e7c6cb526e5216e5f
    # (upstream publishes no semver tags). Pin that digest if latest breaks.
    image: grafana/mcp-grafana:latest
    container_name: deadair-mcp-grafana
    # -address: listen on 8010 inside the container so it matches the host
    #   port 1:1. The server validates the Host header against its listen port
    #   (DNS-rebinding protection), so a remapped port (e.g. 8010->8000) makes
    #   every request 403.
    # -allowed-hosts: explicit, covering both spellings of loopback.
    command:
      [
        "-t", "streamable-http",
        "-address", "0.0.0.0:8010",
        "-allowed-hosts", "localhost:8010,127.0.0.1:8010",
      ]
    # Reads GRAFANA_URL and GRAFANA_SERVICE_ACCOUNT_TOKEN. The file is
    # gitignored; compose fails loudly here if you haven't created it.
    env_file:
      - agents/grafana_probe/.env
    ports:
      # 8010 because `adk web` owns host port 8000. Bound to localhost so the
      # token-holding server is never reachable from the LAN.
      - "127.0.0.1:8010:8010"
    restart: unless-stopped

  # --- Step 1a: synthetic metrics source -------------------------------------
  emitter:
    build: ./plant/emitter
    container_name: deadair-emitter
    ports:
      # Exposed so `make set VALUE=n` can drive it from the host.
      - "127.0.0.1:9101:9101"
    restart: unless-stopped

  # --- L1: source + encoder (brief §5) ---------------------------------------
  encoder:
    build: ./plant/encoder
    container_name: deadair-encoder
    environment:
      # Chaos hook: brief §5's `black_source` mode swaps this for
      #   color=black:size=1920x1080:rate=30
      # which is the failure the whole demo is built around. Keeping the source
      # in the environment means that swap is a restart, not a code change.
      ENCODER_SOURCE: "${ENCODER_SOURCE:-testsrc2=size=1920x1080:rate=30}"
      ENCODER_PRESET: "${ENCODER_PRESET:-ultrafast}"
    volumes:
      - hls-data:/data/hls
    ports:
      - "127.0.0.1:9103:9103"
    restart: unless-stopped

  # --- L1: HLS origin --------------------------------------------------------
  origin:
    build: ./plant/origin
    container_name: deadair-origin
    volumes:
      - hls-data:/data/hls:ro
      # Shared with Alloy, which tails the access log into Loki.
      - nginx-logs:/var/log/deadair
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - encoder
    restart: unless-stopped

  # --- L2: "CDN" edges (brief §5) --------------------------------------------
  # Three caching reverse proxies standing in for three GCP regions. Locally
  # they are containers; the same image deploys to Cloud Run unchanged, since it
  # is a single stdlib process listening on $PORT with no kernel capabilities.
  #
  # Fault injection is application-level, NOT tc netem: netem needs NET_ADMIN,
  # which Cloud Run does not grant. See plant/edge/edge.py.
  edge-us-east1:
    build: ./plant/edge
    container_name: deadair-edge-us-east1
    environment:
      EDGE_REGION: us-east1
      ORIGIN_URL: http://origin:8080
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      - origin
    restart: unless-stopped

  edge-europe-west1:
    build: ./plant/edge
    container_name: deadair-edge-europe-west1
    environment:
      EDGE_REGION: europe-west1
      ORIGIN_URL: http://origin:8080
    ports:
      - "127.0.0.1:8082:8080"
    depends_on:
      - origin
    restart: unless-stopped

  edge-asia-south1:
    build: ./plant/edge
    container_name: deadair-edge-asia-south1
    environment:
      EDGE_REGION: asia-south1
      ORIGIN_URL: http://origin:8080
    ports:
      - "127.0.0.1:8083:8080"
    depends_on:
      - origin
    restart: unless-stopped

  # Traffic so the per-region differential is observable. A stand-in for L3,
  # not L3: no playback clock, no buffer model, no rebuffer events.
  loadgen:
    build: ./plant/loadgen
    container_name: deadair-loadgen
    environment:
      EDGES: "us-east1=http://edge-us-east1:8080,europe-west1=http://edge-europe-west1:8080,asia-south1=http://edge-asia-south1:8080"
      CLIENTS_PER_EDGE: "${CLIENTS_PER_EDGE:-3}"
    depends_on:
      - edge-us-east1
      - edge-europe-west1
      - edge-asia-south1
    restart: unless-stopped

  # --- Step 1b: collector -> Grafana Cloud Mimir + Loki -----------------------
  alloy:
    image: grafana/alloy:latest
    container_name: deadair-alloy
    command:
      [
        "run",
        "--server.http.listen-addr=0.0.0.0:12345",
        "--storage.path=/var/lib/alloy/data",
        "/etc/alloy/config.alloy",
      ]
    volumes:
      - ./plant/alloy/config.alloy:/etc/alloy/config.alloy:ro
      - alloy-data:/var/lib/alloy/data
      # Read-only tail of the origin access log for the Loki pipeline.
      - nginx-logs:/var/log/deadair:ro
    env_file:
      - agents/grafana_probe/.env
    ports:
      # Alloy's own UI -- component graph and remote_write health.
      - "127.0.0.1:12345:12345"
    depends_on:
      - emitter
      - encoder
      - origin
    restart: unless-stopped

  # --- Step 1d: local alert webhook receiver ---------------------------------
  webhook:
    build: ./plant/webhook
    container_name: deadair-webhook
    ports:
      - "127.0.0.1:9102:9102"
    restart: unless-stopped

volumes:
  alloy-data:
  hls-data:
  nginx-logs:
