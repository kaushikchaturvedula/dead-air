worker_processes 1;
events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    types {
        application/vnd.apple.mpegurl m3u8;
        video/mp2t                    ts;
    }

    # Extract the ladder rung from the request path (/hls/<rung>/...) so it can
    # become a Loki label. Four possible values, so it is bounded and safe.
    map $uri $rendition {
        default              "";
        ~^/hls/([^/]+)/      $1;
    }

    # JSON access log so Alloy parses it structurally rather than by regex.
    #
    # Per-segment and per-client fields (uri, remote_addr, session_id) stay in
    # the log LINE, never as labels: that is exactly the high-cardinality data
    # the metrics guard strips, and brief §5 puts it in Loki instead.
    log_format deadair_json escape=json
        '{'
          '"time":"$time_iso8601",'
          '"remote_addr":"$remote_addr",'
          '"method":"$request_method",'
          '"uri":"$uri",'
          '"rendition":"$rendition",'
          '"status":$status,'
          '"bytes_sent":$body_bytes_sent,'
          '"request_time":$request_time,'
          '"user_agent":"$http_user_agent",'
          '"session_id":"$http_x_deadair_session"'
        '}';

    # NOTE: deliberately NOT /var/log/nginx/access.log. The nginx base image
    # symlinks that path to /dev/stdout, so anything written there goes to the
    # container's stdout and never lands in a file -- Alloy would tail it
    # forever and ship zero logs, looking exactly like an auth failure.
    # /var/log/deadair is a plain directory backed by a named volume.
    access_log /var/log/deadair/access.log deadair_json;
    # Second sink so `docker logs deadair-origin` still shows requests.
    access_log /dev/stdout deadair_json;
    error_log  /var/log/deadair/error.log warn;

    sendfile on;
    tcp_nopush on;

    server {
        listen 8080;
        server_name _;

        # hls.js fetches segments via XHR from a page that may be on another
        # origin during development, so CORS is required.
        add_header Access-Control-Allow-Origin   "*" always;
        add_header Access-Control-Allow-Headers  "*" always;
        add_header Access-Control-Expose-Headers "*" always;

        # `root /data` maps /hls/720p/index.m3u8 -> /data/hls/720p/index.m3u8.
        # Using root rather than alias here because alias inside a regex
        # location requires captures and misbehaves without them.

        # Live manifests must never be cached.
        location ~ ^/hls/.+\.m3u8$ {
            root /data;
            add_header Access-Control-Allow-Origin "*" always;
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            expires -1;
        }

        # Segments are immutable once written.
        location ~ ^/hls/.+\.ts$ {
            root /data;
            add_header Access-Control-Allow-Origin "*" always;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        location /hls/ {
            root /data;
            autoindex on;
        }

        location /player/ {
            alias /usr/share/nginx/player/;
            index index.html;
        }

        location = /healthz {
            access_log off;
            return 200 "ok\n";
        }

        location = / {
            return 302 /player/;
        }
    }
}
